apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-ao-banking-qwen-config
  namespace: ${ACK_NAMESPACE}
  labels:
    app.kubernetes.io/name: splunk-ao-banking-qwen
data:
  SPLUNK_AO_PROJECT: "${SPLUNK_AO_PROJECT}"
  SPLUNK_AO_AGENT_STREAM: "${SPLUNK_AO_AGENT_STREAM}"
  SPLUNK_AO_CONSOLE_URL: "${SPLUNK_AO_CONSOLE_URL}"
  APP_MODEL_PROVIDER: "${APP_MODEL_PROVIDER}"
  APP_MODEL_NAME: "${APP_MODEL_NAME}"
  APP_MODEL_BASE_URL: "${APP_MODEL_BASE_URL}"
  MODEL_REQUEST_TIMEOUT: "${MODEL_REQUEST_TIMEOUT}"
  MODEL_MAX_RETRIES: "${MODEL_MAX_RETRIES}"
  PINECONE_INDEX_NAME: "${PINECONE_INDEX_NAME}"
  PINECONE_NAMESPACE: "${PINECONE_NAMESPACE}"
  PINECONE_TEXT_FIELD: "${PINECONE_TEXT_FIELD}"
  SPLUNK_AO_EXPERIMENT_EVALUATORS: "${SPLUNK_AO_EXPERIMENT_EVALUATORS}"
  SPLUNK_AO_EXPERIMENT_DATASET: "${SPLUNK_AO_EXPERIMENT_DATASET}"
  SUPERVISOR_PROMPT_PROFILE: "${SUPERVISOR_PROMPT_PROFILE}"
  SUPERVISOR_PROMPT_CUSTOM: ""
  OTEL_SERVICE_NAME: "splunk-ao-banking-qwen-demo-ack"
